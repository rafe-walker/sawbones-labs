[package]
name = "sawbones-trust-root-fw"
description = "PROVISIONAL firmware image for the Sawbones trust root (RP2350, thumbv8m.main-none-eabihf). The loop logic lives in sawbones-trust-root; this crate is the chip glue."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sawbones-trust-root-fw"
path = "src/main.rs"
test = false
bench = false

# Not the workspace lints: register access needs `unsafe`. It is denied
# everywhere but the one chip module, and every block there says why it holds.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dependencies]
sawbones-interlock = { path = "../../crates/sawbones-interlock", default-features = false }
sawbones-trust-root = { path = "../../crates/sawbones-trust-root" }

# Only the chip build pulls these in. Deliberately no HAL: see src/main.rs.
[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
rp235x-pac = { version = "0.2.0", features = ["rt", "critical-section"] }
