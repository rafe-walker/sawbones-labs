[package]
name = "sawbones-redteam"
description = "Test-only crate: loads the red-team attack catalog in redteam/catalog, checks its schema and its ratchet, and runs the deterministic attack tests against the real Sawbones crates. Never published."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
# Signs module identities in the module-link tests, with seeds kept under tests/.
ed25519-dalek = { version = "3.0.0", default-features = false }
sawbones-busguard = { path = "../sawbones-busguard", features = ["test-unverified"] }
sawbones-interlock = { path = "../sawbones-interlock" }
sawbones-module-protocol = { path = "../sawbones-module-protocol", features = ["verify"] }
sawbones-policy = { path = "../sawbones-policy" }
sawbones-reading = { path = "../sawbones-reading" }
# Register maps (#174): the write map comes from data.
sawbones-regmap = { path = "../sawbones-regmap" }
# The supervisor skeleton (#100), driven by the fakes in its own tests/.
sawbones-isolation = { path = "../sawbones-isolation" }
sawbones-supervisor = { path = "../sawbones-supervisor" }
sawbones-sim-modules = { path = "../sawbones-sim-modules" }
