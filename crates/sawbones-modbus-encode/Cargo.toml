[package]
name = "sawbones-modbus-encode"
description = "PROVISIONAL shared encoder for the Sawbones test bench: one typed Modbus bus-write action, one exact RTU frame and one action digest, used by the policy engine, the approvals and the bus guard alike. no_std, no allocation. The design is under review."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["serde"]
# Serialize (never Deserialize) on the action and its digest, so the host can
# log them. The crate is `no_std` either way; turn this off for the firmware
# build.
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }
# SHA-256 for the action digest. No default features: no allocation, no OID
# tables; the hash itself is no_std.
sha2 = { version = "0.11", default-features = false }
