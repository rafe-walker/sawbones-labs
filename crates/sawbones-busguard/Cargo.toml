[package]
name = "sawbones-busguard"
description = "PROVISIONAL bus guard logic for the Sawbones test bench: a pure, no_std state machine that passes a Modbus RTU frame only if it was approved. The design is under review."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["serde"]
# Serialize and Deserialize on the plain data types (frames' reasons, rules,
# the allow-list). Never on the trust-root event or the guard itself. The
# crate is `no_std` either way; turn this off for the firmware build.
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
serde_json.workspace = true
