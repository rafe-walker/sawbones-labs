[package]
name = "sawbones-module-protocol"
description = "PROVISIONAL wire protocol between the Sawbones bench supervisor and its hardware modules: framed, versioned and checksummed typed messages, total decoding, sessions and sequence numbers, and module identity by a signed challenge. no_std, no allocation. The design is under review."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Host side: check a module's identity signature (Ed25519). Module firmware
# signs and never needs it. The crate is `no_std` and allocation-free either
# way.
verify = ["dep:ed25519-dalek"]

[dependencies]
# Verify only: no precomputed tables, no zeroize, no alloc.
ed25519-dalek = { version = "3.0.0", default-features = false, optional = true }
# The hazard class and the lease target a class 2 or 3 command must carry are
# the interlock's own types, so the two cannot drift. No serde in firmware.
sawbones-interlock = { path = "../sawbones-interlock", default-features = false }
# SHA-256 for the action digest and the manifest digest. No allocation.
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
# Tests sign identities with fixed seeds kept under tests/, never in src/.
ed25519-dalek = { version = "3.0.0", default-features = false }
# A release approval carried by the protocol is a sawbones-approvals message:
# the tests check the lengths agree and that one survives the trip.
sawbones-approvals = { path = "../sawbones-approvals", features = ["test-keys"] }
sawbones-interlock = { path = "../sawbones-interlock", default-features = false }
sawbones-module-protocol = { path = ".", features = ["verify"] }
