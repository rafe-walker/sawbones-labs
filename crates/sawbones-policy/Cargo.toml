[package]
name = "sawbones-policy"
description = "PROVISIONAL hazard-class policy engine for the Sawbones test bench: classifies typed effect requests against write-map and bus facts, as a pure function. The design is under review."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sawbones-interlock = { path = "../sawbones-interlock" }
sawbones-reading = { path = "../sawbones-reading" }
serde.workspace = true
thiserror.workspace = true
# The one encoder from a typed bus write to its frame and action digest,
# shared with the approvals and the bus guard (#203).
sawbones-modbus-encode = { path = "../sawbones-modbus-encode" }

[dev-dependencies]
# #203: one action from the policy engine through the interlock, a signed
# approval and the bus guard, end to end. Test builds only.
sawbones-approvals = { path = "../sawbones-approvals", features = ["test-keys"] }
sawbones-busguard = { path = "../sawbones-busguard" }
serde_json.workspace = true
