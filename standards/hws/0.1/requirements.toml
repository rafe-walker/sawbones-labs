# Hardware Write Safety (HWS) 0.1, working draft.
# One [[requirement]] record per requirement. Status is not stored here:
# it is computed from requirement records that cite these IDs.
# See standards/hws/0.1/README.md.

[[requirement]]
id = "HWS-CLS-1"
area = "CLS"
level = "MUST"
title = "Every actuating action has a hazard class"
text = "Every action that can change a physical output carries exactly one class from an ordered, published scale before it is offered. An action with no class is refused, and unknown means most restricted."
rationale = "A missing label must never read as harmless, so the default has to be the strictest outcome."
borrows = ["IEC 61508 risk tiers", "MCP pessimistic defaults for tool annotations"]
verify = ["test", "analysis"]
version_added = "0.1"

[[requirement]]
id = "HWS-CLS-2"
area = "CLS"
level = "MUST"
title = "Class comes from code and typed fields"
text = "The class is computed by deterministic code from typed action fields and device facts. Agent-written prose never sets or changes it."
rationale = "The planner is untrusted, so anything it can phrase must not decide how dangerous an action is."
borrows = ["Gap analysis: planner is untrusted"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-CLS-3"
area = "CLS"
level = "MUST"
title = "A never class is refused in every state"
text = "A class of actions with no safe procedure exists, is never offered, and is refused in every device and session state."
rationale = "Some hazards cannot be made safe by approval; the only control is that the path does not exist."
borrows = ["IEC 61508 avoidance by design"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-CLS-4"
area = "CLS"
level = "MUST"
title = "Energy classes only go up"
text = "A class assigned to an energy-relevant target can be raised, never lowered, by a plugin, a device report or a lower-trust fact."
rationale = "A compromised or mistaken source must not be able to talk a dangerous target down to a harmless one."
borrows = ["IEC 62443 least privilege"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-APR-1"
area = "APR"
level = "MUST"
title = "Hazardous actions need a physically granted lease"
text = "A hazardous (keyed) action runs only under a lease created by a person's physical act at the device. Software, phones and the agent cannot create one."
rationale = "Approval that software can fabricate is not approval; a human-held physical step is the one thing an agent cannot forge."
borrows = ["OSHA 1910.147 human-held lock", "lockable mode selector (ISO 10218-1)"]
verify = ["test", "inspection"]
version_added = "0.1"

[[requirement]]
id = "HWS-APR-2"
area = "APR"
level = "MUST"
title = "A lease binds the exact action and state"
text = "A lease binds one target, value, unit and state digest. Any change to them voids the lease."
rationale = "Approval of one thing must not be spendable on another thing, or on the same thing after the world changed."
borrows = ["Gap analysis: approval bound to the action"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-APR-3"
area = "APR"
level = "MUST"
title = "Leases are single-use and short-lived"
text = "A lease is spent by its first use and expires on a short timer run by the safety function's own clock. A clock that moves backwards ends the lease."
rationale = "A short, single-use window limits what a stale or stolen approval can do."
borrows = ["IEC 60204-1 deliberate act"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-APR-4"
area = "APR"
level = "MUST"
title = "Leases do not survive disarm, restart or fault"
text = "Disarming, restarting or faulting the safety function drops every lease. A lease is never restored from storage."
rationale = "Approval belongs to the conditions it was given under; when they end, so does it."
borrows = ["OSHA 1910.147 release procedure"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-APR-5"
area = "APR"
level = "MUST"
title = "Approvals are signed, counted and expiring"
text = "Approvals are signed, carry a per-signer rising counter and an expiry. A replayed, reordered or expired approval is refused."
rationale = "Without a counter and expiry, a captured approval can be replayed indefinitely."
borrows = ["IEC 62443 identification and authentication"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-APR-6"
area = "APR"
level = "MUST"
title = "The approver sees the action and a state code from the safety function"
text = "The approval display shows the action and a state code generated by the safety function. A change of state voids the approval. A model-written summary is never the approval text."
rationale = "A person can only approve what they can see, and the planner must not control what they see."
borrows = ["Gap analysis: approval display", "OWASP Agentic Top 10 human-trust exploitation"]
verify = ["test", "inspection"]
version_added = "0.1"

[[requirement]]
id = "HWS-APR-7"
area = "APR"
level = "MUST"
title = "Approval roles are separated"
text = "A role that cannot touch energy, such as an owner's phone, cannot grant energy leases or change the allow-list."
rationale = "A convenient control channel must not become a path to hazardous authority."
borrows = ["IEC 62443 use control"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-ISF-1"
area = "ISF"
level = "MUST"
title = "The safety function is independent of the planner"
text = "The function that removes power runs on separate hardware outside the planner's domain. It accepts no assertion of safety from the agent host."
rationale = "A safety function that shares a failure or a compromise with the thing it guards guards nothing."
borrows = ["ISO 13849-1 categories (redundant, monitored structure)", "NVIDIA Halos safety island"]
verify = ["analysis", "inspection"]
version_added = "0.1"

[[requirement]]
id = "HWS-ISF-2"
area = "ISF"
level = "MUST"
title = "No software event turns an output on"
text = "No event on the agent side can switch an output on. Enabling requires a physical arm input."
rationale = "Software on the agent side can be wrong or hostile; power-on needs something it cannot do."
borrows = ["ISO 10218-1 lockable operating modes"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-ISF-3"
area = "ISF"
level = "MUST"
title = "A watchdog independent of the controller cuts the output"
text = "A watchdog with its own supply monitor and clock cuts the output if the safety controller stalls or misbehaves."
rationale = "A glitched or hung controller cannot be relied on to cut its own power."
borrows = ["ISO 26262 external supervision", "ISO 13849-1 cross-monitoring"]
verify = ["test", "analysis"]
version_added = "0.1"

[[requirement]]
id = "HWS-ISF-4"
area = "ISF"
level = "MUST"
title = "Faults latch and clear only by a physical act"
text = "Faults latch, survive power loss and clear only by a physical act that is recorded with its provenance. An unreadable or armed record at boot comes up faulted."
rationale = "A fault that clears itself or resets on reboot hides the cause and repeats the hazard."
borrows = ["ISO 13850 latch and reset"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-ISF-5"
area = "ISF"
level = "MUST"
title = "A stuck-on output is detected"
text = "A stuck-on output is detected through feedback, and the safety function drops everything and latches."
rationale = "An output that stays on after being told to stop is the failure the whole design exists to catch."
borrows = ["ISO 13849-1 output monitoring"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-ISF-6"
area = "ISF"
level = "SHOULD"
title = "The claim states diagnostic coverage and common-cause analysis"
text = "A claim for the safety path states its diagnostic coverage and a common-cause failure analysis. It does not quote a SIL or PL it has not been assessed for."
rationale = "Numbers without analysis mislead; a plain statement of what was and was not analysed does not."
borrows = ["ISO 13849-1 diagnostic coverage and common-cause failure", "IEC 61508 safety integrity"]
verify = ["analysis"]
version_added = "0.1"

[[requirement]]
id = "HWS-HBT-1"
area = "HBT"
level = "MUST"
title = "Liveness is a challenge with a fresh nonce"
text = "Liveness is a challenge from the safety function carrying a fresh hardware-sourced nonce. A wrong, stale, early, repeated or missing answer counts as loss. No heartbeat starts without entropy."
rationale = "A fixed ping can be replayed by a dead or compromised host; a challenge needs a live computation."
borrows = ["question-and-answer watchdog", "ISO 26262 supervision"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-HBT-2"
area = "HBT"
level = "MUST"
title = "Loss of heartbeat drops outputs within a stated time"
text = "Loss of the heartbeat drops outputs within a stated time bound and latches a fault."
rationale = "A bound that is stated can be measured and proof-tested; an unstated one cannot."
borrows = ["IEC 60204-1 stop category 0"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-HBT-3"
area = "HBT"
level = "SHOULD"
title = "Every device link times out into its own safe state"
text = "Every device link times out into the device's own safe state without help from the supervisor."
rationale = "If the supervisor is the thing that failed, the device still has to end up safe."
borrows = ["IEC 61508 fail-safe behaviour"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-STP-1"
area = "STP"
level = "MUST"
title = "Each output has a defined safe state"
text = "Each output has a defined safe state, reached on any fault, reset, brown-out or loss of power. Outputs stay off through boot."
rationale = "Safety has to be the state the hardware falls into, not a state software must remember to enter."
borrows = ["IEC 61508 safe state"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-STP-2"
area = "STP"
level = "MUST"
title = "Emergency stop works with the agent host off"
text = "An emergency stop works with the agent host unpowered and latches. Resetting it restarts nothing."
rationale = "The stop has to be the one control that does not depend on the part that might be misbehaving."
borrows = ["IEC 60204-1 emergency stop", "ISO 13850 emergency stop function"]
verify = ["test", "inspection"]
version_added = "0.1"

[[requirement]]
id = "HWS-STP-3"
area = "STP"
level = "SHOULD"
title = "Stop category is declared per output"
text = "The stop category (0, 1 or 2) is declared for each output. Energy outputs default to category 0."
rationale = "Different loads need different stops, and the choice should be written down, not implied."
borrows = ["IEC 60204-1 stop categories"]
verify = ["inspection"]
version_added = "0.1"

[[requirement]]
id = "HWS-STP-4"
area = "STP"
level = "MUST"
title = "Isolation is verified before energizing"
text = "Arming is refused when an unintended ground or energy path is found. Isolation is verified before energizing."
rationale = "Proving the isolation holds, rather than assuming it, is what makes lockout meaningful."
borrows = ["OSHA 1910.147 verification of isolation"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-BUS-1"
area = "BUS"
level = "MUST"
title = "The bus guard forwards only the approved frame"
text = "A guard outside the planner's domain forwards only a frame that is byte-identical to an approved one."
rationale = "Checking intent is guesswork; checking bytes is not."
borrows = ["IEC 62443 zones and conduits filtering"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-BUS-2"
area = "BUS"
level = "MUST"
title = "One shared encoder serves policy, approval and guard"
text = "One shared encoder serves policy, approval and guard, and every approval carries a digest of the exact frame."
rationale = "If each component encodes its own way, what was approved can differ from what is sent."
borrows = ["Gap analysis: approval bound to the action"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-BUS-3"
area = "BUS"
level = "MUST"
title = "Default deny on the bus"
text = "Broadcast and reserved addresses, unsupported function codes, and malformed, concatenated or split frames never pass the guard."
rationale = "A bus is a broad channel; everything not named has to be refused."
borrows = ["IEC 62443 restricted data flow"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-BUS-4"
area = "BUS"
level = "MUST"
title = "An approved frame passes at most once"
text = "An approved frame passes at most once. An unanswered write blocks new leases until a readback shows the result."
rationale = "A write whose outcome is unknown must not be repeated or stacked on top of."
borrows = ["OSHA 1910.147 verification step"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-BUS-5"
area = "BUS"
level = "MUST"
title = "The command path cannot transmit while disarmed"
text = "The command path cannot put anything on the bus while the system is disarmed."
rationale = "Disarmed has to mean silent, including against a misbehaving driver."
borrows = ["IEC 62443 restricted data flow"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-PRV-1"
area = "PRV"
level = "MUST"
title = "Every fact has a host-assigned origin and trust tier"
text = "Every fact carries an origin and a trust tier assigned by the host, never by its content. A consumer cannot set its own tier."
rationale = "If content can claim its own trustworthiness, trust tiers mean nothing."
borrows = ["Gap analysis: provenance of facts"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-PRV-2"
area = "PRV"
level = "MUST"
title = "Hazardous actions rest on measured or owner-attested facts"
text = "A hazardous action rests only on facts that are measured or attested by the owner. Agent-inferred and unverified facts cannot back it."
rationale = "Inference is where a persuasive but wrong belief enters."
borrows = ["Gap analysis: provenance of facts"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-PRV-3"
area = "PRV"
level = "MUST"
title = "Facts and approval tokens expire"
text = "Facts and approval tokens expire. Mastership and state facts carry lifetimes."
rationale = "A fact true at approval time may be false at action time."
borrows = ["ISO 14119 periodic checks"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-PRV-4"
area = "PRV"
level = "MUST"
title = "A device's own report alone cannot back a class 2 or higher action"
text = "A value reported only by the device being acted on cannot back a class 2 or higher action unless an independent instrument agrees."
rationale = "A device that lies, or is reflashed, is evidence about itself only."
borrows = ["Gap analysis: provenance of facts"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-PRV-5"
area = "PRV"
level = "MUST"
title = "A firmware change voids what an instrument measured"
text = "A firmware change in an instrument voids what it measured until a known-answer check passes."
rationale = "A reflashed instrument is a different instrument."
borrows = ["IEC 61508 lifecycle and modification control"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-TXT-1"
area = "TXT"
level = "MUST"
title = "Outside text is typed, fenced and inert"
text = "Text from outside the operator and the host is typed as untrusted and fenced when shown to the model. It can never become an identifier or a command."
rationale = "Prompt injection works by letting data act as instruction."
borrows = ["Gap analysis: outside text", "OWASP Agentic Top 10 goal hijack"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-TXT-2"
area = "TXT"
level = "MUST"
title = "A taint latch limits actions after outside text"
text = "After outside text enters the model's context, actions above the safe class are refused until a physical act occurs after the taint."
rationale = "Once the planner may have been steered, only a human's physical act restores trust."
borrows = ["Gap analysis: outside text"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-TXT-3"
area = "TXT"
level = "MUST"
title = "The gate holds the latch, not the agent"
text = "The taint latch is held by the gate, not the agent. Approvals given before the taint do not clear it."
rationale = "A latch the agent can touch is not a latch."
borrows = ["Gap analysis: outside text"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-TXT-4"
area = "TXT"
level = "MUST"
title = "A pasted approval has no effect"
text = "A pasted or transcribed approval has no effect. Only the signed physical path counts."
rationale = "Text can be forged by anyone who can write text."
borrows = ["Gap analysis: approval channel"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-TXT-5"
area = "TXT"
level = "SHOULD"
title = "The agent's tool surface is a fixed set of verbs split by class"
text = "The agent sees a fixed set of tools named by hazard class. Devices and plugins appear as data, never as new tools."
rationale = "A tool list that changes with attached hardware lets hardware shape the agent's authority."
borrows = ["MCP 2026-07-28 tool list stability"]
verify = ["inspection"]
version_added = "0.1"

[[requirement]]
id = "HWS-LOG-1"
area = "LOG"
level = "MUST"
title = "A tamper-evident record of every proposal and outcome"
text = "A tamper-evident record keeps every proposal, class, approval, refusal and outcome, refusals included."
rationale = "Review and incident response need to see what was refused and why, not only what happened."
borrows = ["IEC 62443 audit and accountability", "MCP audit duty"]
verify = ["test", "inspection"]
version_added = "0.1"

[[requirement]]
id = "HWS-LOG-2"
area = "LOG"
level = "MUST"
title = "Fault reason and provenance survive power loss"
text = "The safety function records the reason and provenance of a fault in storage that survives power loss."
rationale = "A fault that leaves no trace cannot be diagnosed or trusted to have been cleared properly."
borrows = ["IEC 61508 diagnostic records"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-LOG-3"
area = "LOG"
level = "MUST"
title = "A conformance claim ships an evidence pack"
text = "A conformance claim comes with an evidence pack: a requirement-to-test map, tool and firmware versions, and hardware captures."
rationale = "A claim that cannot be checked by someone else is an opinion."
borrows = ["IEC 61508 lifecycle evidence"]
verify = ["inspection"]
version_added = "0.1"

[[requirement]]
id = "HWS-TST-1"
area = "TST"
level = "MUST"
title = "Every defect becomes a named regression check"
text = "Every defect becomes a named regression check plus a ledger row, in the same change as the fix."
rationale = "A fixed bug without a test comes back."
borrows = ["IEC 61508 lifecycle verification"]
verify = ["inspection"]
version_added = "0.1"

[[requirement]]
id = "HWS-TST-2"
area = "TST"
level = "MUST"
title = "Every decoder of outside bytes is fuzzed in CI"
text = "Every decoder that reads bytes from outside the trust boundary is fuzzed in CI."
rationale = "Decoders are where hostile bytes first meet code."
borrows = ["IEC 62443-4-1 secure development"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-TST-3"
area = "TST"
level = "MUST"
title = "A versioned adversarial catalog runs on every change"
text = "A versioned catalog of adversarial cases (injection, bus, hardware) runs against the real crates on every change."
rationale = "Attacks that were thought of once must keep being tried."
borrows = ["Gap analysis: adversarial testing"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-TST-4"
area = "TST"
level = "MUST"
title = "The installed safety path is proof-tested on an interval"
text = "The installed safety path is proof-tested on a stated interval: stop, heartbeat loss, stuck output and time to cut, each with a dated record."
rationale = "Safety functions fail silently; only periodic tests find that."
borrows = ["ISO 14119 function tests", "IEC 61508 proof tests"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-TST-5"
area = "TST"
level = "MUST"
title = "The author of a decoder does not change its safety tests in the same change"
text = "A change to a decoder and a change to its safety tests are never made together."
rationale = "The party changing the code must not be able to move the bar it is measured against."
borrows = ["separation of duties"]
verify = ["inspection"]
version_added = "0.1"

[[requirement]]
id = "HWS-PHY-1"
area = "PHY"
level = "MUST"
title = "Arm switch, key and panel button are physical"
text = "The arm switch, key and panel button are physical devices with no software path that can simulate them."
rationale = "If software can press the button, the button is not a human check."
borrows = ["ISO 10218-1 lockable operating modes"]
verify = ["inspection", "test"]
version_added = "0.1"

[[requirement]]
id = "HWS-PHY-2"
area = "PHY"
level = "MUST"
title = "Firmware updates need a physical jumper"
text = "Firmware update needs a fitted physical jumper. Fitting it while armed faults, and removing it needs a fresh arm."
rationale = "Changing the safety function's own code is the most dangerous write there is."
borrows = ["ISO 14119 defeat resistance"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-PHY-3"
area = "PHY"
level = "MUST"
title = "A person can physically lock out the energy source"
text = "A person can lock out the energy source physically so that no software can re-energize it. The lock is individually owned."
rationale = "Lockout is the one control a person can verify by sight and own personally."
borrows = ["OSHA 1910.147 lockout and tagout"]
verify = ["inspection"]
version_added = "0.1"

[[requirement]]
id = "HWS-UPD-1"
area = "UPD"
level = "MUST"
title = "Safety firmware installs only after a physical countersignature"
text = "Safety firmware and core releases install only after the safety function countersigns the digest through a physical act."
rationale = "The agent must not be able to replace the code that constrains it."
borrows = ["IEC 62443-4-1 secure update"]
verify = ["test"]
version_added = "0.1"

[[requirement]]
id = "HWS-UPD-2"
area = "UPD"
level = "MUST"
title = "Boot is signed with rollback protection"
text = "Boot on the safety controller is signed and protected against rollback."
rationale = "Signed boot stops substituted code; rollback protection stops old, vulnerable code."
borrows = ["IEC 62443 software integrity"]
verify = ["test", "inspection"]
version_added = "0.1"

[[requirement]]
id = "HWS-UPD-3"
area = "UPD"
level = "SHOULD"
title = "The build chain is pinned and reviewed"
text = "The build chain is pinned and reviewed: actions pinned by commit, build code allow-listed, and no private key in the default build."
rationale = "A compromised build defeats every other control."
borrows = ["IEC 62443-4-1 secure development"]
verify = ["test", "inspection"]
version_added = "0.1"

[[requirement]]
id = "HWS-HUM-1"
area = "HUM"
level = "MUST"
title = "Approval prompts are generated from typed fields"
text = "Approval prompts are generated by the gate from typed fields, never from agent text."
rationale = "Persuasive phrasing is an attack on the approver."
borrows = ["OWASP Agentic Top 10 human-trust exploitation"]
verify = ["inspection"]
version_added = "0.1"

[[requirement]]
id = "HWS-HUM-2"
area = "HUM"
level = "SHOULD"
title = "Low classes need no prompt"
text = "Low hazard classes need no approval prompt, so approval effort stays scarce and fatigue and bypass are less likely."
rationale = "Prompts that fire for everything are clicked through."
borrows = ["ISO 14119 incentive to defeat"]
verify = ["analysis"]
version_added = "0.1"

[[requirement]]
id = "HWS-HUM-3"
area = "HUM"
level = "MUST"
title = "The operator can always see armed state, pending class and latch state"
text = "The operator can see the armed state, the class of any pending action and the taint-latch state at all times."
rationale = "A person cannot supervise what they cannot see."
borrows = ["IEC 60204-1 operator interface"]
verify = ["inspection"]
version_added = "0.1"
