nominal_v = 12.0
max_v = 13.0
isolation_domain = "GND_SYS"

[[net]]
name = "MID"
domain = "12V_LOAD"
nominal_v = 12.0
max_v = 13.0
isolation_domain = "GND_SYS"

[[net]]
name = "K2_OUT"
domain = "12V_LOAD"
nominal_v = 12.0
max_v = 13.0
isolation_domain = "GND_SYS"

[[net]]
name = "RAIL_BUS"
domain = "12V_LOAD"
nominal_v = 12.0
max_v = 13.0
isolation_domain = "GND_SYS"

[[net]]
name = "RAIL_B_HI"
domain = "12V_LOAD"
nominal_v = 12.0
max_v = 13.0
isolation_domain = "GND_SYS"

[[net]]
name = "LAMP_A_NEG"
domain = "12V_LOAD_SWITCHED"
nominal_v = 12.0
max_v = 13.0
isolation_domain = "GND_SYS"
notes = "Switched node. No tool ground ever."

[[net]]
name = "LAMP_B_NEG"
domain = "12V_LOAD_SWITCHED"
nominal_v = 12.0
max_v = 13.0
isolation_domain = "GND_SYS"
notes = "Switched node. No tool ground ever."

[[net]]
name = "V5"
domain = "5V"
nominal_v = 5.05
max_v = 5.1
isolation_domain = "GND_SYS"

[[net]]
name = "V5_ADJ"
domain = "5V_TEST"
nominal_v = 5.0
max_v = 5.5
isolation_domain = "GND_SYS"
notes = "M2 output; replaces V5 to TR/WD during exit test 1."

[[net]]
name = "V3V3_TR"
domain = "3V3_TR"
nominal_v = 3.3
max_v = 3.6
isolation_domain = "GND_SYS"

[[net]]
name = "V3V3_WD"
domain = "3V3_WD"
nominal_v = 3.3
max_v = 3.6
isolation_domain = "GND_SYS"

[[net]]
name = "LOGIC_3V3"
domain = "3V3_TR"
nominal_v = 3.3
max_v = 3.6
isolation_domain = "GND_SYS"
notes = "Generic name for single-ended 3.3 V logic signals; each connection's notes name the signal."

[[net]]
name = "RLY_IN"
domain = "5V"
nominal_v = 5.05
max_v = 5.1
isolation_domain = "GND_SYS"

[[net]]
name = "LOGIC_5V_WD"
domain = "5V"
nominal_v = 5.05
max_v = 5.1
isolation_domain = "GND_SYS"

[[net]]
name = "PI_UART"
domain = "3V3_PI"
nominal_v = 3.3
max_v = 3.6
isolation_domain = "GND_SYS"

[[net]]
name = "GUARD_UART"
domain = "3V3_GUARD"
nominal_v = 3.3
max_v = 3.6
isolation_domain = "GND_GUARD"

[[net]]
name = "RS485_AB"
domain = "RS485"
nominal_v = 5.0
max_v = 12.0
isolation_domain = "ISO_RS485"

[[net]]
name = "USB"
domain = "USB"
nominal_v = 5.0
max_v = 5.25
isolation_domain = "GND_SYS"

# GND_GUARD is the same copper as GND_SYS through the guard's USB ground (C721 records this bridge); declared
# separately so the iiunius isolation boundary is explicit. The two isolated bus sides (iiunius and Waveshare)
# are joined by C805 into one floating domain, ISO_RS485, used for both isolators.

