[[fault]]
id = "A28"
path = "P?_*"
variant = "both"
fault = "Tool ground (analyzer clip, or a meter on a current range) across the MOSFET or a lamp"
element = "LA"
effect = "Bypasses the low-side MOSFET. Procedure rule: the analyzer clip is cut or insulated and its ground is a soldered lead to a TB-GND post; no meter on a current range across a switched node (revised after independent review non-blocking 5)"
load_state = "on"
detected_by = "procedure rule only"
verdict = "FAIL"

[[fault]]
id = "A29"
path = "P?_*"
variant = "both"
fault = "12 V adapter overvoltage (24 V class) or the buck trimpot bumped high"
element = "PSU12"
effect = "The SCR crowbar also catches a buck set above 5.66 V. Lamps are rated 12-24 V; buck input rating UNVERIFIED (revised after independent review B2)"
load_state = "off"
detected_by = "-"
verdict = "PASS"


[[fault]]
id = "A23"
path = "P?_*"
variant = "both"
fault = "Any wire off in the series chain"
element = "chain"
effect = "Open circuit"
load_state = "off"
