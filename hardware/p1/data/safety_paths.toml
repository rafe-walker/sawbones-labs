# Sawbones Labs P1 bench: safety paths and single-fault tables (draft, 2026-11-26). Field names stable; see method.md §5.
# variant: "A" = ATtiny85 BOD + WDT + charge pump only; "B" = A + MAX813L (U4 fitted, J_B shorted).
# load_state: off | off-detected | on-bounded (needs bound_ms) | on.  verdict: PASS | WARN | FAIL.

schema_version = 1

# ---------------- Paths ----------------

[[path]]
id = "PA_A"
load = "Lamp A (rail A, hazard class 2)"
variant = "A"
description = "F1 -> ESTOP NC1 -> ARM -> K1 -> K2 -> INA228 shunt -> RAIL_BUS -> lamp A -> MOS_A (low side) -> GND"

[[path.series_elements]]
order = 1
id = "F1"
part = "F1"
pins = ["A", "B"]
kind = "fuse"
controlled_by = "none"
supply_net = "V12_IN"
board = "PWR"
trigger_polarity = "n/a"
open_when = "overcurrent > 1 A"

[[path.series_elements]]
order = 2
id = "ESTOP_NC1"
part = "ESTOP"
pins = ["NC1.1", "NC1.2"]
kind = "contact-nc"
controlled_by = "human"
supply_net = "V12_F1"
board = "PANEL"
trigger_polarity = "n/a"
open_when = "pressed, wire off"

[[path.series_elements]]
order = 3
id = "ARM"
part = "SW_ARM"
pins = ["1", "2"]
kind = "contact-no"
controlled_by = "human"
supply_net = "ESTOP_OUT"
board = "PANEL"
trigger_polarity = "n/a"
open_when = "toggle off, wire off"

[[path.series_elements]]
order = 4
id = "K1"
part = "RLY"
pins = ["K1.COM", "K1.NO"]
kind = "relay-no"
controlled_by = "RP_TR (charge pump GP14 -> Q51)"
supply_net = "V5"
board = "RLY"
trigger_polarity = "held only while GP14 toggles"
open_when = "pump stops (freeze, reset, brownout, unpowered, pin stuck), Q51 open, 5 V lost"

[[path.series_elements]]
order = 5
id = "K2"
part = "RLY"
pins = ["K2.COM", "K2.NO"]
kind = "relay-no"
controlled_by = "U3_ATTINY85 (charge pump PB3 -> Q61)"
supply_net = "V5"
board = "RLY"
trigger_polarity = "held only while PB3 toggles (only after a correct, fresh Q&A answer)"
open_when = "ATtiny trip, freeze, reset, BOD, supply lost; Q61 open; 5 V lost"

[[path.series_elements]]
order = 6
id = "Q_A"
part = "MOS_A"
pins = ["LOAD"]
kind = "mosfet-low-side"
controlled_by = "RP_TR (level GP12)"
supply_net = "RAIL_BUS"
board = "MOS-A"
trigger_polarity = "active-high"
open_when = "GP12 low/pulled-down/unpowered, logic GND off, rail A not armed"

[[path]]
id = "PA_B"
load = "Lamp B (rail B port 0, hazard class 3)"
variant = "A"
description = "As PA_A to RAIL_BUS -> KEY NO -> RAIL_B_HI -> lamp B -> MOS_B (low side) -> GND"

[[path.series_elements]]
order = 1
id = "F1"
part = "F1"
pins = ["A", "B"]
kind = "fuse"
controlled_by = "none"
supply_net = "V12_IN"
board = "PWR"
trigger_polarity = "n/a"
open_when = "overcurrent"

[[path.series_elements]]
order = 2
id = "ESTOP_NC1"
part = "ESTOP"
pins = ["NC1.1", "NC1.2"]
kind = "contact-nc"
controlled_by = "human"
supply_net = "V12_F1"
board = "PANEL"
trigger_polarity = "n/a"
open_when = "pressed"

[[path.series_elements]]
order = 3
id = "ARM"
part = "SW_ARM"
pins = ["1", "2"]
kind = "contact-no"
controlled_by = "human"
supply_net = "ESTOP_OUT"
board = "PANEL"
trigger_polarity = "n/a"
open_when = "off"

[[path.series_elements]]
order = 4
id = "K1"
part = "RLY"
pins = ["K1.COM", "K1.NO"]
kind = "relay-no"
controlled_by = "RP_TR (charge pump GP14 -> Q51)"
supply_net = "V5"
board = "RLY"
trigger_polarity = "held only while GP14 toggles"
open_when = "pump stops"

[[path.series_elements]]
order = 5
id = "K2"
part = "RLY"
pins = ["K2.COM", "K2.NO"]
kind = "relay-no"
controlled_by = "U3_ATTINY85 (charge pump PB3 -> Q61)"
supply_net = "V5"
board = "RLY"
trigger_polarity = "held only while PB3 toggles"
open_when = "ATtiny trip"

[[path.series_elements]]
order = 6
id = "KEY"
part = "SW_KEY"
pins = ["NO1", "NO2"]
kind = "contact-no"
controlled_by = "human"
supply_net = "RAIL_BUS"
board = "PANEL"
trigger_polarity = "n/a"
open_when = "key off"

[[path.series_elements]]
order = 7
id = "Q_B"
part = "MOS_B"
pins = ["LOAD"]
kind = "mosfet-low-side"
controlled_by = "RP_TR (level GP13, only with a live lease)"
supply_net = "RAIL_B_HI"
board = "MOS-B"
trigger_polarity = "active-high"
open_when = "no lease, GP13 low, key off (no gate supply)"

# Variant B paths: same series elements; K2 additionally opened by U4 via Q63 clamp on HOLD2.
