# ---------------- Rows added after the independent review (A31-A39, B12, B13) and by the design CI (A40) ----------------
# A31-A39 and B12-B13 are the independent reviewer's rows (hardware/p1/independent-review.md section 4), with the verdict of the
# design as revised. A40 was added by the design CI (HW-018 found no row for F1).

[[fault]]
id = "A31"
path = "P?_*"
variant = "both"
fault = "Relay IN shorted to GND (off-by-one Dupont housing, stray strand, solder splash)"
element = "K1|K2"
effect = "That relay is held regardless of its pump. Keyed JST-XH connectors and separate modules mean one slip holds one cut only; the arm-time per-cut self-test finds it"
load_state = "off"
detected_by = "MID_SENSE (K1); arm-time self-test (K2)"
verdict = "WARN"

[[fault]]
id = "A32"
path = "P?_*"
variant = "both"
fault = "Relay module opto or driver transistor collector-emitter short"
element = "K1|K2"
effect = "Same as a welded relay (A11, A12): the other cut and the MOSFET still cut"
load_state = "off"
detected_by = "MID_SENSE (K1); arm-time self-test (K2)"
verdict = "PASS"

[[fault]]
id = "A33"
path = "P?_*"
variant = "both"
fault = "Relay coil open or module VCC lost"
element = "K1|K2"
effect = "The relay is open, so the bench cannot arm"
load_state = "off"
detected_by = "arm-time check"
verdict = "PASS"

[[fault]]
id = "A34"
path = "P?_*"
variant = "both"
fault = "Debug or ISP channel connected to the supervisor host (SWD, ATtiny ISP, BOOT)"
element = "RP_TR"
effect = "Code on the host could halt the RP2350, answer the Q&A and drive GP12, defeating K1, K2 and the MOSFET together. With the probe hosted on the Mac only, a keyed lead unplugged except for flashing and test 5a, and no Pi path to ISP, there is no path (HW-030)"
load_state = "off"
detected_by = "procedure and physical disconnect; HW-030 in CI"
verdict = "PASS"

[[fault]]
id = "A35"
path = "P?_*"
variant = "both"
fault = "ATtiny PB3 driven by timer hardware"
element = "U3_ATTINY85"
effect = "The pump would survive a CPU hang until the watchdog. Firmware rule: PB3 is bit-banged inside the validated Q&A loop, never driven by Timer0 or Timer1. Becomes PASS when a CI grep for that rule exists"
load_state = "off"
detected_by = "firmware rule (not yet in CI)"
verdict = "WARN"

[[fault]]
id = "A36"
path = "P?_*"
variant = "both"
fault = "E-stop pressed then released with a firmware sense fault"
element = "ESTOP_NC1"
effect = "NC1 cuts power. Preventing restart on release rests on RP2350 firmware (ESTOP_SENSE and the arm off-then-on rule): single-fault tolerant at the sensing level (NC2 and ARM_SENSE) but not in hardware. The recommended K0 seal-in relay closes it (open owner decision)"
load_state = "off"
detected_by = "ESTOP_SENSE, ARM_SENSE; test 4c"
verdict = "WARN"

[[fault]]
id = "A37"
path = "P?_*"
variant = "both"
fault = "Buck trimpot bumped high (5.5-12 V on the 5 V rail)"
element = "M1_BUCK5"
effect = "As A26: only the SCR crowbar catches a rail above its trip point. The 1N5339B zener would not"
load_state = "off"
detected_by = "SCR crowbar blows F2"
verdict = "PASS"

[[fault]]
id = "A38"
path = "P?_B"
variant = "both"
fault = "Key switch contacts welded or shorted"
element = "KEY"
effect = "Rail B is gated by MOS-B and a live lease only (as A13)"
load_state = "off"
detected_by = "KEY_SENSE stays on after key-off"
verdict = "PASS"

[[fault]]
id = "A39"
path = "P?_*"
variant = "both"
fault = "RP2350 answers the Q&A while the safety logic is stalled (dual core, interrupt or FIFO)"
element = "RP_TR"
effect = "K1, K2 and the MOSFET are all held. K2 is a liveness monitor, not a second decision-maker: two cuts, one decision-maker. Rules: the answer is a function of the ATtiny's unpredictable challenge, at most one SPI TX FIFO word per pass, produced in the same pass as the pump toggle"
load_state = "off"
detected_by = "firmware rules; P2: the ATtiny gets its own view of the e-stop"
verdict = "WARN"

[[fault]]
id = "A40"
path = "P?_*"
variant = "both"
fault = "F1 too large for the wire, or fails to open on overload"
element = "F1"
effect = "The load is not energised by this fault. The 22 AWG wire (3 A) is protected only by a 1 A fuse (M4); the 5-30 A Nilight kit does not protect it. Do not upsize F1 above 2 A in P1: K1 and K2 carry the same downstream short current in series, so a large fault current is a common-cause weld of both"
load_state = "off"
detected_by = "BOM check: only 1 A and 2 A fuses are fitted"
verdict = "WARN"

[[fault]]
id = "B12"
path = "PB_*"
variant = "B"
fault = "WDO to MR pulse train (the MAX813L watchdog resets itself through MR)"
element = "U4_MAX813L"
effect = "RESET is a 140-280 ms pulse every 1.2-2.5 s, not a held cut. Fixed by Q64 resetting the ATtiny (PB3 stays tri-stated until a fresh Q&A) and the RP2350 latching on the VBUS loss (HW-033)"
load_state = "off"
detected_by = "RP2350 OutputMismatch latch"
verdict = "PASS"

[[fault]]
id = "B13"
path = "PB_*"
variant = "B"
fault = "U4 VCC fed through the 1N4007 reverse-protection diode"
element = "U4_MAX813L"
effect = "VCC about 4.2 V is below the 4.50-4.75 V threshold, so U4 sits in reset and K2 can never close (an availability failure, not a safety one). Fixed by deleting the diode and feeding WD 5 V straight from TB-5V"
load_state = "off"
detected_by = "bring-up: U4 VCC at least 4.9 V"
verdict = "PASS"

# ---------------- Charge pumps (HW-031) ----------------
# HOLD is solved from the pump frequency, series capacitor, diode drops, store capacitor, bleed and base resistors and the relay
# input current. The toggle period is the firmware's: GP14 toggles once per 10 ms tick (50 Hz); the ATtiny bit-bangs PB3 at about 1 kHz.
# Revised after independent review B1. Set 1 serves a relay input current up to 3 mA, set 2 up to 9 mA; measure I_IN first.

[[pump]]
id = "PUMP1"
element = "K1"
driver = "RP_TR"
relay = "RLY1"
toggle_period_us = 10000
vpp_v = 3.3
c_series_f = 1.0e-6
r_series_ohm = 470.0
diode_vf_v = 0.25
c_hold_f = 10.0e-6
r_bleed_ohm = 47000.0
r_base_ohm = 10000.0
vbe_v = 0.6
hfe_min = 70.0
parameter_set = 1
dropout_ms = [27, 116]

[[pump]]
id = "PUMP2"
element = "K2"
driver = "U3_ATTINY85"
relay = "RLY2"
toggle_period_us = 500
vpp_v = 3.3
c_series_f = 220.0e-9
r_series_ohm = 470.0
diode_vf_v = 0.25
c_hold_f = 1.0e-6
r_bleed_ohm = 100000.0
r_base_ohm = 4700.0
vbe_v = 0.6
hfe_min = 70.0
parameter_set = 1
dropout_ms = [8, 15]

