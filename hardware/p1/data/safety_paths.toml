[[fault]]
id = "A34"
path = "P?_*"
variant = "both"
fault = "Debug or ISP channel connected to the supervisor host (SWD, ATtiny ISP, BOOT)"
element = "RP_TR"
effect = "Code on the host could halt the RP2350, answer the Q&A and drive GP12, defeating K1, K2 and the MOSFET together. The probe is hosted on the Mac only, its keyed lead unplugged except for flashing and test 5a, there is no Pi path to ISP or SWD, and the analyzer (whose firmware the host uploads and whose buffer is unverified) is hosted on the Mac and treated as drive-capable: HW-030 finds no path"
load_state = "off"
detected_by = "procedure and physical disconnect; HW-030 in CI"
verdict = "PASS"
remaining_cuts = ["K1", "K2", "Q_*"]

[[fault]]
id = "A35"
path = "P?_*"
variant = "both"
fault = "ATtiny PB3 driven by timer hardware"
element = "U3_ATTINY85"
effect = "The pump would survive a CPU hang until the watchdog. Firmware rule: PB3 is bit-banged inside the validated Q&A loop, never driven by Timer0 or Timer1. Becomes PASS when a CI grep for that rule exists"
load_state = "off"
detected_by = "firmware rule (not yet in CI)"
verdict = "WARN"
remaining_cuts = ["K1", "Q_*"]
fault_mode = "holds"

[[fault]]
id = "A36"
path = "P?_*"
variant = "both"
fault = "E-stop pressed then released with one firmware sense fault"
element = "ESTOP_NC1"
effect = "NC1 cuts power. Releasing it looks like an arm off-then-on at ARM_SENSE, so one sense fault used to restart rail A. U-EOUT (a PC817 on ESTOP_OUT, between NC1 and the arm toggle, read on GP17) is now a second independent sense: an arm cycle counts only if ESTOP_OUT stayed live throughout, and ESTOP_OUT dead while GP2 reads released latches SenseMismatch. One sense fault no longer restarts the rail; two would, and only the K0 seal-in relay (open owner decision) removes that. HW-036 checks the topology; test 4c"
load_state = "off"
detected_by = "ESTOP_OUT (GP17), ESTOP_SENSE, ARM_SENSE; test 4c"
verdict = "WARN"
remaining_cuts = ["K1", "Q_*"]

[[fault]]
id = "A37"
path = "P?_*"
variant = "both"
fault = "Buck trimpot bumped high (5.5-12 V on the 5 V rail)"
element = "M1_BUCK5"
effect = "As A26: the SCR crowbar catches a rail above 5.66 V and F3 clears the live buck. A zener would not, and a fuse in front of the buck alone never sees the crowbar current (revised after review 3, B2)"
load_state = "off"
detected_by = "SCR crowbar blows F2"
verdict = "PASS"
remaining_cuts = ["K1", "K2", "Q_*"]

[[fault]]
id = "A38"
path = "P?_B"
variant = "both"
