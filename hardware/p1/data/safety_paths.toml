[[fault]]
id = "A27"
path = "P?_*"
variant = "both"
fault = "INA228 dead / NACK"
element = "INA228"
effect = "No VBUS feedback; firmware must latch a fault (gap)"
load_state = "off"
detected_by = "I2C error (firmware addition needed)"
