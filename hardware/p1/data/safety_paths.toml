# ---------------- Variant B: all A rows apply to PB_* unchanged, plus/changed: ----------------

[[fault]]
id = "B1"
path = "PB_*"
variant = "B"
fault = "ATtiny runaway that keeps toggling PB3 but stops toggling PB4"
element = "U3_ATTINY85"
effect = "WDO goes low after 1.00-2.25 s, MR pulls RESET high for 140-280 ms, Q63 clamps the Q61 base and Q64 resets the ATtiny, so PB3 tri-states and K2 opens. RESET is a pulse, not a latch: the RP2350 latches OutputMismatch on the VBUS loss and the cut becomes permanent until re-arm (revised after independent review B3a; the original text said OFF after 2.25 s without a latch)"
load_state = "off"
bound_ms = 2250
detected_by = "U4 RESET"
verdict = "PASS"

[[fault]]
id = "B2"
path = "PB_*"
variant = "B"
fault = "ATtiny fuses at factory and 3V3_WD sags (closes A10)"
element = "U3_ATTINY85"
effect = "PFI < 1.20-1.30 V (3V3_WD < 2.64-2.86 V) -> PFO low -> MR -> RESET -> clamp"
load_state = "off"
detected_by = "U4 RESET"
verdict = "PASS"

[[fault]]
id = "B3"
path = "PB_*"
variant = "B"
fault = "5 V rail below 4.50-4.75 V"
element = "V5"
effect = "RESET high -> clamp -> K2 off"
load_state = "off"
detected_by = "U4 RESET"
verdict = "PASS"

[[fault]]
id = "B4"
path = "PB_*"
variant = "B"
fault = "Power-up"
element = "U4_MAX813L"
effect = "RESET high 140-280 ms after threshold -> K2 held off during boot"
load_state = "off"
detected_by = "exit test 1 D7"
verdict = "PASS"

[[fault]]
id = "B5"
path = "PB_*"
variant = "B"
fault = "MAX813L counterfeit / out-of-spec"
element = "U4_MAX813L"
effect = "Layer B unreliable; variant A unchanged"
load_state = "off"
