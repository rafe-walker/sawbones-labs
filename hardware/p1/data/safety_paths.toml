element = "KEY"
effect = "Rail B is gated by MOS-B and a live lease only (as A13)"
load_state = "off"
detected_by = "KEY_SENSE stays on after key-off"
verdict = "PASS"
remaining_cuts = ["K1", "K2", "Q_*"]

[[fault]]
id = "A39"
path = "P?_*"
variant = "both"
fault = "RP2350 answers the Q&A while the safety logic is stalled (dual core, interrupt or FIFO)"
element = "RP_TR"
effect = "K1, K2 and the MOSFET are all held: the stalled RP2350 keeps its pump, its answers and GP12 alive. K2 is a liveness monitor of the RP2350, not a second decision-maker: two cuts, one decision-maker. A stated limit, not a pass (exit test 5g). Mitigations are firmware: the answer is a function of the ATtiny's unpredictable challenge, at most one SPI TX FIFO word per pass, produced in the same pass as the pump toggle; P2: the ATtiny gets its own view of the e-stop"
load_state = "on"
detected_by = "exit test 5g (a limit); firmware rules"
verdict = "FAIL"
fault_mode = "holds"

[[fault]]
id = "A40"
path = "P?_*"
variant = "both"
fault = "F1 too large for the wire, or fails to open on overload"
element = "F1"
effect = "The load is not energised by this fault. The 22 AWG wire (3 A) is protected only by a 1 A fuse (M4); the 5-30 A Nilight kit does not protect it. Do not upsize F1 above 2 A in P1: K1 and K2 carry the same downstream short current in series, so a large fault current is a common-cause weld of both"
load_state = "off"
detected_by = "BOM check: only 1 A and 2 A fuses are fitted"
verdict = "WARN"
remaining_cuts = ["K1", "K2", "Q_*"]

[[fault]]
id = "B12"
path = "PB_*"
variant = "B"
fault = "WDO to MR pulse train (the MAX813L watchdog resets itself through MR)"
element = "U4_MAX813L"
effect = "RESET is a 140-280 ms pulse every 1.2-2.5 s, not a held cut. Fixed by the hardware latch LATCH_WD (Q65/Q66) that a person clears; HW-033 requires a hardware latch part on the cut's own board that no other cut controls or feeds (revised after review 3, B4)"
load_state = "off"
detected_by = "HW-033; latch test in test 5f"
verdict = "PASS"
remaining_cuts = ["K1", "K2", "Q_*"]

[[fault]]
id = "B13"
path = "PB_*"
variant = "B"
fault = "U4 VCC fed through the 1N4007 reverse-protection diode"
element = "U4_MAX813L"
effect = "VCC about 4.2 V is below the 4.50-4.75 V threshold, so U4 sits in reset and K2 can never close (an availability failure, not a safety one). Fixed by deleting the diode and feeding WD 5 V straight from TB-5V"
load_state = "off"
detected_by = "bring-up: U4 VCC at least 4.9 V"
verdict = "PASS"
remaining_cuts = ["K1", "K2", "Q_*"]

[[fault]]
id = "A41"
path = "P?_*"
variant = "both"
fault = "Logic analyzer able to drive its probe wires (host-uploaded FX2 firmware, input buffer wiring unverified, buffer-less clones exist)"
element = "LA"
effect = "A compromised AI host could pull a relay input low, pump a relay with the RP2350 in reset, or raise GP12. The analyzer is hosted on the Mac for every test and the checker treats it as drive-capable until input_only_verified is set after a meter check; the evidence for tests 2 and 5 is recorded by a host that is not an AI host (HW-030, HW-022; review 3, B6)"
load_state = "off"
detected_by = "HW-030, HW-022 in CI; meter check of the 74LVC245 DIR and OE pins"
verdict = "PASS"
remaining_cuts = ["K1", "K2", "Q_*"]

[[fault]]
id = "A42"
path = "P?_*"
variant = "both"
fault = "Crowbar SCR destroyed (possibly open) by a live buck current-limiting into it"
element = "M6_SCR|F3"
effect = "F3 (1 A, between the buck output and the rail) clears the buck's 3.5-7.5 A limit in 0.02-0.5 s, inside the SCR's rated time, so the SCR is not left to carry 5-9 W (HW-029; review 3, B2). A destroyed SCR that fails open leaves the rail unclamped, which is the single-fault case the buck short row A26 covers only while the SCR lives"
load_state = "off"
detected_by = "HW-029; crowbar acceptance test"
verdict = "WARN"
remaining_cuts = ["K1", "K2", "Q_*"]

[[fault]]
id = "B14"
path = "PB_*"
variant = "B"
fault = "Latch LATCH_WD fails (Q65 or Q66 open, short, or the RESET button stuck)"
element = "LATCH_WD|Q63"
effect = "Stuck set: K2 can never close (availability). Stuck clear or open: variant A behaviour, K2 is still cut by the ATtiny pump alone. The button held down clears the latch, which only matters while U4 is also asserting RESET, and then K2 follows U4 again within one pulse period"
load_state = "off"
detected_by = "latch test in test 5f"
verdict = "PASS"
remaining_cuts = ["K1", "Q_*"]

# ---------------- Charge pumps (HW-031) ----------------
# HW-031 computes the hold voltage at the worst corner of these component values and the dropout window from the last edge
# to the relay hold current, from the component values below (event model, ci/check_hardware.py sim_pump). Nothing here is a
# typed-in result except dropout_ms, which must bracket the computed window or the rule FAILs.
# GP14 toggles once per 10 ms tick (50 Hz); the ATtiny bit-bangs PB3 at about 1 kHz. Revised after review 3: corner values,
# set 1 for I_IN of 2 mA or less, set 2 for 5 mA or less (the review-2 limits of 3 and 9 mA failed at worst case), C62 470 nF and R62 47 k.

[[pump]]
id = "PUMP1"
element = "K1"
driver = "RP_TR"
relay = "RLY1"
parameter_set = 1
load_ma = 2.0
toggle_period_us = 10000
c_series_f = 1.0e-6
c_series_tol = 0.10
r_series_ohm = 470.0
c_hold_f = 10.0e-6
c_hold_tol_lo = 0.20
c_hold_tol_hi = 0.20
r_bleed_ohm = 47000.0
r_base_ohm = 10000.0
r_tol = 0.01
vpp_min_v = 3.2
vpp_max_v = 3.3
diode_vf_min_v = 0.20
diode_vf_max_v = 0.30
vbe_min_v = 0.60
vbe_max_v = 0.70
hfe_min = 60.0
hfe_max = 200.0
dropout_ms = [60.0, 205.0]

[[pump]]
id = "PUMP1B"
element = "K1"
driver = "RP_TR"
relay = "RLY1"
parameter_set = 2
load_ma = 5.0
toggle_period_us = 10000
c_series_f = 2.2e-6
c_series_tol = 0.10
r_series_ohm = 470.0
c_hold_f = 22.0e-6
c_hold_tol_lo = 0.20
c_hold_tol_hi = 0.20
r_bleed_ohm = 47000.0
r_base_ohm = 4700.0
r_tol = 0.01
vpp_min_v = 3.2
vpp_max_v = 3.3
diode_vf_min_v = 0.20
diode_vf_max_v = 0.30
vbe_min_v = 0.60
vbe_max_v = 0.70
hfe_min = 60.0
hfe_max = 200.0
dropout_ms = [125.0, 315.0]

[[pump]]
id = "PUMP2"
element = "K2"
driver = "U3_ATTINY85"
relay = "RLY2"
parameter_set = 1
load_ma = 5.0
toggle_period_us = 500
c_series_f = 220.0e-9
c_series_tol = 0.10
r_series_ohm = 470.0
c_hold_f = 470.0e-9
c_hold_tol_lo = 0.10
c_hold_tol_hi = 0.10
r_bleed_ohm = 47000.0
r_base_ohm = 4700.0
r_tol = 0.01
vpp_min_v = 3.05
vpp_max_v = 3.3
diode_vf_min_v = 0.20
diode_vf_max_v = 0.30
vbe_min_v = 0.60
vbe_max_v = 0.70
hfe_min = 60.0
hfe_max = 200.0
dropout_ms = [3.5, 8.0]

# ---------------- Timing budgets (HW-035) ----------------
# A bound is the sum of its components: the Q&A period (with its clock tolerance), the pump drop-out HW-031 computes, and the
# relay release time. A fault row's bound_ms must be at least its budget's sum.

[[budget]]
id = "BUD_K2"
cut = "K2"
bound_ms = 120
components = [ { name = "two Q&A periods, OSCCAL-calibrated clock", periods = 2, period_ms = 25.0, tol = 0.01 }, { name = "K2 pump drop-out", pump = "PUMP2" }, { name = "K2 relay release", relay = "RLY2" } ]

[[budget]]
id = "BUD_A7"
cut = "K2"
bound_ms = 25
components = [ { name = "K2 pump drop-out", pump = "PUMP2" }, { name = "K2 relay release", relay = "RLY2" } ]

[[budget]]
id = "BUD_A6"
cut = "Q_A"
bound_ms = 210
components = [ { name = "two heartbeat periods", periods = 2, period_ms = 100.0, tol = 0.0 }, { name = "one 10 ms tick", ms = 10.0 } ]

[[budget]]
id = "BUD_A14"
cut = "K1"
bound_ms = 340
components = [ { name = "one 10 ms tick", ms = 10.0 }, { name = "K1 pump drop-out (slowest set)", pump = ["PUMP1", "PUMP1B"] }, { name = "K1 relay release", relay = "RLY1" } ]

[[budget]]
id = "BUD_B1"
cut = "K2"
bound_ms = 2250
components = [ { name = "MAX813L watchdog timeout, maximum", ms = 2250.0 } ]

