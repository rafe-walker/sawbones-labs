[[fault]]
id = "A26"
path = "P?_*"
variant = "both"
fault = "5 V buck fails shorted (12 V on 5 V rail)"
element = "M1_BUCK5"
effect = "With the SCR crowbar (TL431A anode to GND driving a 2N3906 that fires the BT151-500R; trips at 5.37-5.66 V, computed by HW-029) the rail is pulled to about 1.2 V, all logic is unpowered and the coils release. A shorted switch blows F2 (adapter) and F3 (buck output); a live buck current-limits at 3.5-7.5 A into the SCR, which F3 clears in 0.02-0.5 s (revised after review 3, B1 and B2: the review-2 anode-to-gate wiring tripped at 6-16 V, and a live buck never blew F2)"
load_state = "off"
detected_by = "-"
verdict = "PASS"
remaining_cuts = ["K1", "K2", "Q_*"]

[[fault]]
id = "A30"
path = "P?_*"
variant = "both"
