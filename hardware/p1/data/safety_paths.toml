# ---------------- Single-fault table, variant A (applies to PA_A and PA_B unless path says otherwise) ----------------
# Rows A1-A30 mirror compatibility.md 3.2. Paths are matched as glob patterns on the path id: "P?_*" is every path.
# Variant "both" rows hold in variant A and in variant B (compatibility.md 3.3: "every row of table A still holds").
# A10 stays variant A only: in variant B the MAX813L power-fail input closes it (row B2).

[[fault]]
id = "A1"
path = "P?_*"
variant = "both"
fault = "RP2350 frozen / SWD halt"
element = "RP_TR"
effect = "GP12/13 frozen (maybe high). GP14 stops, so K1 opens after its pump drop-out of about 0.03-0.22 s at the real 50 Hz toggle (revised after independent review B1). No Q&A answers, so PB3 stops and K2 opens within 2 x 50 ms + about 15 ms: K2, not K1, meets the 120 ms bound"
load_state = "off"
bound_ms = 120
detected_by = "MID_SENSE, ATtiny trip"
verdict = "PASS"

[[fault]]
id = "A2"
path = "P?_*"
variant = "both"
fault = "RP2350 reset / reset loop"
element = "RP_TR"
effect = "Pads pull-down + ISO; ext 4.7 k pull-down -> Q_A off; pump stops -> K1 off; ATtiny trips -> K2 off; FaultStateUnknown latched"
load_state = "off"
detected_by = "fault record"
verdict = "PASS"

[[fault]]
id = "A3"
path = "P?_*"
variant = "both"
fault = "RP2350 brownout"
element = "RP_TR"
effect = "The RP2350 brownout detector watches DVDD only; between about 1.8 and 3.3 V on IOVDD the chip runs in spec, so outputs stay under firmware control. Below that the internal reset applies, as A2. The partial-gate region only heats the AOD4184 (revised after independent review, non-blocking 6)"
load_state = "off"
detected_by = "fault record"
verdict = "PASS"

[[fault]]
id = "A4"
path = "P?_*"
variant = "both"
fault = "RP2350 unpowered (5 V present)"
element = "RP_TR"
effect = "No opto current into MOS_A; no pump; no back-feed path because no relay IN is GPIO-driven"
load_state = "off"
detected_by = "ATtiny trip"
verdict = "PASS"

[[fault]]
id = "A5"
path = "P?_*"
variant = "both"
fault = "GPIO state at power-up before firmware"
element = "RP_TR"
effect = "Pull-down + ISO until firmware drives outputs low first; ext pull-downs cover E9 (A2 stepping)"
load_state = "off"
detected_by = "exit test 1 capture"
verdict = "PASS"

[[fault]]
id = "A6"
path = "P?_*"
variant = "both"
fault = "Pi off / supervisor hung"
element = "PI5"
effect = "Heartbeat lost -> firmware drops GP12/13 and stops GP14 within 2 x HEARTBEAT_PERIOD"
load_state = "off"
bound_ms = 210
detected_by = "fault latched"
verdict = "PASS"

[[fault]]
id = "A7"
path = "P?_*"
variant = "both"
fault = "ATtiny frozen"
element = "U3_ATTINY85"
effect = "PB3 DC -> K2 opens"
load_state = "off"
bound_ms = 20
detected_by = "MID_SENSE high with VBUS 0"
verdict = "PASS"

[[fault]]
id = "A8"
path = "P?_*"
variant = "both"
fault = "ATtiny reset or BOD"
element = "U3_ATTINY85"
effect = "Port B tri-state -> pump stops -> K2 opens"
load_state = "off"
detected_by = "VBUS 0"
verdict = "PASS"

[[fault]]
id = "A9"
path = "P?_*"
variant = "both"
fault = "Watchdog supply lost"
element = "M5_LDO"
effect = "As A8"
load_state = "off"
detected_by = "VBUS 0"
verdict = "PASS"

[[fault]]
id = "A10"
path = "PA_*"
variant = "A"
fault = "ATtiny fuses left at factory (BOD off, WDTON off, 1 MHz)"
element = "U3_ATTINY85"
effect = "Erratic AVR at low VCC may keep pumping; K1 and Q_A remain under RP2350"
load_state = "off"
detected_by = "bring-up fuse read-back (avrdude) recorded as evidence"
verdict = "WARN"

[[fault]]
id = "A11"
path = "P?_*"
variant = "both"
fault = "K1 contacts welded"
element = "K1"
effect = "K2 and Q_A still cut"
load_state = "off-detected"
detected_by = "MID_SENSE live while K1 commanded off (firmware addition needed)"
verdict = "PASS"

[[fault]]
id = "A12"
path = "P?_*"
variant = "both"
fault = "K2 contacts welded"
element = "K2"
effect = "K1 and Q_A still cut; invisible without an arm-time self-test (deliberate wrong answer, expect VBUS 0)"
load_state = "off"
detected_by = "arm-time self-test (not written)"
verdict = "WARN"

[[fault]]
id = "A13"
path = "P?_A"
variant = "both"
fault = "MOS_A drain-source short"
element = "Q_A"
effect = "Lamp A on whenever armed (= commanded state); off when disarmed via K1/K2"
load_state = "off-detected"
detected_by = "RAIL_A_SENSE vs command after disarm"
verdict = "PASS"

[[fault]]
id = "A14"
path = "P?_B"
variant = "both"
fault = "MOS_B drain-source short"
element = "Q_B"
effect = "Lamp B on with armed + key and no lease; RAIL_B_SENSE live while commanded off -> firmware drops K1 and Q_A on that tick, latches"
load_state = "on-bounded"
bound_ms = 30
detected_by = "RAIL_B_SENSE"
verdict = "PASS"

[[fault]]
id = "A15"
path = "P?_*"
variant = "both"
fault = "Q51 (K1 driver) C-E short"
element = "K1"
effect = "K1 held; K2 and Q_A cut"
load_state = "off-detected"
detected_by = "MID_SENSE"
verdict = "PASS"

[[fault]]
id = "A16"
path = "P?_*"
variant = "both"
fault = "Q61 (K2 driver) C-E short"
element = "K2"
effect = "K2 held; K1 and Q_A cut"
load_state = "off"
detected_by = "arm-time self-test only"
verdict = "WARN"

[[fault]]
id = "A17"
path = "P?_*"
variant = "both"
fault = "Pump series capacitor short (either)"
element = "K1|K2"
effect = "Relay follows DC pin level; the other relay still cuts"
load_state = "off"
detected_by = "per-cut self-test"
verdict = "PASS"

[[fault]]
id = "A18"
path = "P?_*"
variant = "both"
fault = "Bridge IN1-IN2 on one relay module"
element = "RLY1|RLY2"
effect = "With K1 and K2 on separate relay modules, IN2 unused and tied to VCC through 1 k, a bridge on one module can hold only that module's channel 1: the other cut still works (revised after independent review B5)"
load_state = "off"
detected_by = "arm-time self-test"
verdict = "PASS"

[[fault]]
id = "A19"
path = "P?_*"
variant = "both"
fault = "E-stop NC1 fails to open"
element = "ESTOP_NC1"
effect = "NC2 opens -> firmware drops all"
load_state = "off-detected"
detected_by = "ESTOP_SENSE vs VBUS"
verdict = "PASS"

[[fault]]
id = "A20"
path = "P?_*"
variant = "both"
fault = "E-stop power-path wire off"
element = "chain"
effect = "Open circuit"
load_state = "off"
detected_by = "VBUS / sense"
verdict = "PASS"

[[fault]]
id = "A21"
path = "P?_*"
variant = "both"
fault = "ESTOP_SENSE wire off"
element = "ESTOP"
effect = "Pull-up reads pressed -> fault"
load_state = "off"
detected_by = "fault"
verdict = "PASS"

[[fault]]
id = "A22"
path = "P?_*"
variant = "both"
fault = "Arm toggle welded closed"
element = "ARM"
effect = "Never seen off-then-on after restart -> never arms"
load_state = "off"
detected_by = "-"
verdict = "PASS"

[[fault]]
id = "A24"
path = "P?_*"
variant = "both"
fault = "Enable line or MOS logic GND off"
element = "Q_A|Q_B"
effect = "Opto not driven"
load_state = "off-detected"
detected_by = "commanded on + sensed dead -> fault after OUTPUT_SETTLE"
verdict = "PASS"

[[fault]]
id = "A25"
path = "P?_*"
variant = "both"
fault = "Rail sense wire off"
element = "sense"
effect = "Reads dead; hides a later stuck-on (second fault)"
load_state = "off"
detected_by = "arm-time (commanded on, sensed dead)"
verdict = "PASS"

[[fault]]
id = "A26"
path = "P?_*"
variant = "both"
fault = "5 V buck fails shorted (12 V on 5 V rail)"
element = "M1_BUCK5"
effect = "With the SCR crowbar (TL431A + BT151-500R, trips at 5.32-5.66 V) the rail is pulled to about 1.2 V, all logic is unpowered, the coils release, and F2 blows (at 350 % or more within 0.5 s) or the adapter hiccups. The SCR survives the adapter's short-circuit current. The 1N5339B zener it replaces could fail before the fuse and clamped at 6.5-8 V (revised after independent review B2)"
load_state = "off"
detected_by = "-"
verdict = "PASS"

[[fault]]
id = "A30"
path = "P?_*"
variant = "both"
fault = "5 V rail lost"
element = "V5"
effect = "Coils de-energise; RP2350 and ATtiny unpowered"
load_state = "off"
detected_by = "-"
