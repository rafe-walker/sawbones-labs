controlled_by = "none"
supply_net = "V12_IN"
board = "PWR"
trigger_polarity = "n/a"
open_when = "overcurrent"
out_nets = ["V12_F1"]

[[path.series_elements]]
order = 2
id = "ESTOP_NC1"
