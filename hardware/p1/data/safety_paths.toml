# Arm-time per-cut self-tests, corrected after review 3 (B7): K1 open makes MID dead, K2 open leaves MID live.
[[selftest]]
id = "ST_K1"
path = "P?_*"
element = "K1"
expect = { S_MID = "dead", S_VBUS = "dead" }

[[selftest]]
id = "ST_K2"
path = "P?_*"
element = "K2"
expect = { S_MID = "live", S_VBUS = "dead" }

[[selftest]]
id = "ST_QA"
path = "P?_A"
element = "Q_A"
expect = { S_RAILA = "dead", S_VBUS = "live" }

[[selftest]]
id = "ST_QB"
path = "P?_B"
element = "Q_B"
expect = { S_RAILB = "dead", S_VBUS = "live" }

# ---------------- 5 V rail clamp (HW-029) ----------------
# The trip band is computed from the divider, the TL431A reference tolerance and the gate drive: trip = Vref x (1 + R1/R2) + Iref x R1.
# Revised after review 3 (B1): anode to GND driving a 2N3906 that fires the SCR. The review-2 anode-to-gate wiring tripped at 6-16 V.

[[clamp]]
id = "CL1"
part = "M6_SCR"
pin = "A"
kind = "scr"
trigger = "tl431-gnd-pnp"
rail = "V5"
r_top_ohm = 12000.0
r_bot_ohm = 10000.0
r_tol = 0.01
vref_min_v = 2.470
vref_max_v = 2.520
iref_max_ua = 4.0
vgt_max_v = 1.5
igt_max_ma = 15.0
r_gate_ohm = 100.0
vce_sat_v = 0.2
trip_min_v = 5.37
clamp_v_max = 5.66
source_v = 12.0
rated_a = 12.0
rated_ms = 1000
protects = ["U4_MAX813L", "M5_LDO", "RP_TR", "RLY1", "RLY2"]
