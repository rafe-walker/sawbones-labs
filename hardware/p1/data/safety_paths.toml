[[fault]]
id = "A31"
path = "P?_*"
variant = "both"
fault = "Relay IN shorted to GND (off-by-one Dupont housing, stray strand, solder splash)"
element = "K1|K2"
effect = "That relay is held regardless of its pump. Separate modules and shrouded keyed plugs of different families (B4B-XH-A on module 1, B5B-XH-A with a blank position on module 2) mean the plugs cannot swap and one slip holds one cut only; the arm-time per-cut self-test finds it (HW-020, HW-037; revised after review 3, B7)"
load_state = "off"
detected_by = "MID_SENSE (K1); arm-time self-test (K2)"
verdict = "WARN"
remaining_cuts = ["K1", "K2", "Q_*"]

[[fault]]
id = "A32"
path = "P?_*"
variant = "both"
fault = "Relay module opto or driver transistor collector-emitter short"
element = "K1|K2"
effect = "Same as a welded relay (A11, A12): the other cut and the MOSFET still cut"
load_state = "off"
detected_by = "MID_SENSE (K1); arm-time self-test (K2)"
verdict = "PASS"
remaining_cuts = ["K1", "K2", "Q_*"]

[[fault]]
id = "A33"
path = "P?_*"
variant = "both"
fault = "Relay coil open or module VCC lost"
element = "K1|K2"
effect = "The relay is open, so the bench cannot arm"
