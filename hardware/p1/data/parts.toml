notes = "Q65 base from U4 RESET via 10 k with 100 k to GND; Q65 collector via 10 k to the Q66 base with 47 k from the Q66 base to 5 V; Q66 collector via 10 k back to the Q65 base (hold path) and via R68 10 k to the Q63 base. The U4 power-on pulse sets it at every power-up, so K2 stays open after any power loss until a person presses RESET. The ATtiny RESET pin is driven only by its 10 k pull-up."

