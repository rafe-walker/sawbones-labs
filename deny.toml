# cargo-deny policy. Run with `cargo deny check`; CI runs it on every push.

[graph]
all-features = true

[advisories]
# Vulnerabilities are always errors. Yanked crates are denied.
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only. Add one here deliberately, with a reason.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "allow"

# Build scripts run arbitrary code at build time [#201, sup-013]. Only the crates
# below may have a build.rs. A new one fails `cargo deny check` until someone
# reviews it and adds it here by name. cargo-deny does not cover proc-macro
# crates (they have no build.rs): ci/check_build_code.py does, with
# ci/build-code-allowlist.txt, in .github/workflows/supply-chain.yml.
[bans.build]
allow-build-scripts = [
    { name = "anyhow" },
    { name = "curve25519-dalek" },
    { name = "libc" },
    { name = "proc-macro2" },
    { name = "quote" },
    { name = "serde" },
    { name = "serde_core" },
    { name = "serde_json" },
    { name = "thiserror" },
    { name = "zmij" },
]
executables = "deny"
include-dependencies = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
