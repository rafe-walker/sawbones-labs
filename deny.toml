# cargo-deny policy. Run with `cargo deny check`; CI runs it on every push.

[graph]
all-features = true

[advisories]
# Vulnerabilities are always errors. Yanked crates are denied.
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only. Add one here deliberately, with a reason.
allow = [
    "Apache-2.0",
    # Wasmtime and Cranelift (#173): Apache-2.0 with the LLVM exception, which only
    # waives attribution for compiled object code. Same terms as Apache-2.0 otherwise.
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "allow"

# Build scripts run arbitrary code at build time [#201, sup-013]. Only the crates
# below may have a build.rs. A new one fails `cargo deny check` until someone
# reviews it and adds it here by name. cargo-deny does not cover proc-macro
# crates (they have no build.rs): ci/check_build_code.py does, with
# ci/build-code-allowlist.txt, in .github/workflows/supply-chain.yml.
[bans.build]
allow-build-scripts = [
    # The plugin host (#173) pulls in wasmtime and Cranelift. Their build scripts
    # (reviewed for the PR): ISLE and x64 assembler code generation into OUT_DIR,
    # a rustc --version probe (crc32fast, rustix, rustversion, target-lexicon),
    # `git rev-parse` for a version string (cranelift-codegen), the C helpers
    # wasmtime compiles with cc, and cfg flags only (the rest).
    { name = "anyhow" },
    { name = "cranelift-assembler-x64" },
    { name = "cranelift-codegen" },
    { name = "cranelift-isle" },
    { name = "crc32fast" },
    { name = "curve25519-dalek" },
    { name = "encoding_rs" },
    { name = "generic-array" },
    { name = "libc" },
    { name = "libm" },
    { name = "proc-macro2" },
    { name = "quote" },
    { name = "rustix" },
    { name = "rustversion" },
    { name = "serde" },
    { name = "serde_core" },
    { name = "serde_json" },
    { name = "target-lexicon" },
    { name = "thiserror" },
    { name = "wasmtime" },
    { name = "wasmtime-internal-core" },
    { name = "wasmtime-internal-cranelift" },
    { name = "wasmtime-internal-unwinder" },
    { name = "zmij" },
]
executables = "deny"
include-dependencies = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
