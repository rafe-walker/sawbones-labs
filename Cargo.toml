[workspace]
resolver = "2"
members = ["crates/*"]
# The cargo-fuzz project needs nightly and its own lock file (#220).
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/rafe-walker/sawbones-labs"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Ed25519 in an unoptimised build is slow enough to drag the tests out.
# Optimise only the curve and hash crates, also in debug and test builds.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# The interlock's exhaustive and random safety tests run some ten million
# steps. Optimise the crate and its tests lightly; overflow checks and debug
# assertions stay on.
[profile.dev.package.sawbones-interlock]
opt-level = 1
