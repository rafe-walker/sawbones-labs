name: Regression guard

# A pull request that fixes a bug must add the check that prevents it, and a
# pull request must not delete tests or CI steps without the `guards-change`
# label. See CONTRIBUTING.md, ci/regression_guard.py and issue #199.
#
# The guard that judges a PR is the copy on the base branch, so a PR cannot
# edit the guard to pass itself. Its own unit tests run from the PR copy.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: regression-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: bug fixes carry a regression check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Unit-test the guard (regression_199)
        run: python3 -I -m unittest discover -s ci -p 'test_*.py' -v
      - name: Check the diff with the base branch copy of the guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          guard="${RUNNER_TEMP}/regression_guard.py"
          git show "${BASE_REF}:ci/regression_guard.py" > "${guard}" 2>/dev/null || cp ci/regression_guard.py "${guard}"
          python3 -I "${guard}"
