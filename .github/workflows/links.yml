name: Links

on:
  pull_request:
    paths: ["**/*.md", ".github/workflows/links.yml"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal:
    name: lychee (repo-internal links, gates PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --accept 200,429
            --offline
            --exclude 'claude\.ai'
            --exclude 'github\.com/users/rafe-walker/projects'
            --exclude-path target
            '**/*.md'
          fail: true

  external:
    name: lychee (external links, weekly)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --accept 200,429
            --max-retries 3
            --timeout 30
            --exclude 'claude\.ai'
            --exclude 'github\.com/users/rafe-walker/projects'
            --exclude-path target
            '**/*.md'
          fail: true
