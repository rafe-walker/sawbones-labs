name: Links

on:
  pull_request:
    paths: ["**/*.md", ".github/workflows/links.yml"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: lychee
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --accept 200,429
            --exclude 'claude\.ai'
            --exclude 'github\.com/users/rafe-walker/projects'
            --exclude-path target
            '**/*.md'
          fail: true
