name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # arm64 is the Raspberry Pi 5's CPU family.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        # rustup reads rust-toolchain.toml: version, components and profile.
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  firmware:
    name: no_std build (RP2350)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build each crate in ci/no_std_crates.txt for thumbv8m.main-none-eabihf
        run: ci/check_no_std.sh

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build docs, failing on any warning
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --locked

  coverage:
    name: coverage (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@18101caa61cb89118e2ee749786f33c6d1f8a8cb # v2.90.9
        with:
          tool: cargo-llvm-cov
      - name: Measure coverage
        run: cargo llvm-cov --workspace --locked --json --summary-only --output-path coverage.json
      - name: Per-crate line coverage table
        run: python3 ci/coverage_summary.py coverage.json >> "$GITHUB_STEP_SUMMARY"

  test-keys:
    name: no test private key in the firmware build (#172)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        # rust-toolchain.toml lists the firmware target.
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Scan the default firmware build for the test-key marker
        run: ci/no_test_keys_in_default_build.sh

  sample-plugin:
    name: sample plugin built for wasm32 and run in the plugin host (#173)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain and the wasm32 target
        # The wasm target is added in this job only; rust-toolchain.toml and
        # every other job stay as they are.
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the sample decoder plugin for wasm32-unknown-unknown
        working-directory: plugins/sample-decoder
        run: cargo build --release --locked --target wasm32-unknown-unknown
      - name: Load it in the plugin host and decode frames
        run: |
          export SAWBONES_SAMPLE_PLUGIN_CORE="$GITHUB_WORKSPACE/plugins/sample-decoder/target/wasm32-unknown-unknown/release/sawbones_sample_decoder.wasm"
          export SAWBONES_REQUIRE_SAMPLE_PLUGIN=1
          cargo test -p sawbones-plugin-host --locked --test sample_plugin

  build-artifacts:
    name: no build output committed (#208)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: regression_208_no_build_artifacts
        run: ci/no_build_artifacts.sh

  deny:
    name: cargo-deny (advisories, licences, bans, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check
          arguments: --all-features
