name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        # rustup reads rust-toolchain.toml: version, components and profile.
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

  no-std:
    name: no_std firmware builds, no test key in them
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain and the firmware target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add thumbv8m.main-none-eabihf
      - name: Build the no_std crates for the firmware target
        run: |
          cargo build --locked --target thumbv8m.main-none-eabihf -p sawbones-approvals --no-default-features
          cargo build --locked --target thumbv8m.main-none-eabihf -p sawbones-busguard --no-default-features
          cargo build --locked --target thumbv8m.main-none-eabihf -p sawbones-busguard --no-default-features --features approvals
      - name: No test private key in a default build (#172)
        run: ci/no_test_keys_in_default_build.sh

  deny:
    name: cargo-deny (advisories, licences, bans, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check
          arguments: --all-features
