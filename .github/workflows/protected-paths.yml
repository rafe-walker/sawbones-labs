name: Protected paths

# Every check runs from the PR's own checkout, so a PR could loosen the checks
# it is judged by (issue #200). This job lists every changed file under a
# protected path and fails unless the PR carries the `guards-change` label,
# which routes the PR to the clean-room reviewer.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: protected-paths-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  protected-paths:
    name: guard changes need the guards-change label (#200)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: List protected-path changes
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          protected='^(\.github/|ci/|deny\.toml$|_typos\.toml$|rust-toolchain\.toml$|CLAUDE\.md$|CONTRIBUTING\.md$|docs/REGRESSIONS\.md$|redteam/catalog/|standards/)'
          changed="$(git diff --name-only --no-renames "${BASE_REF}...HEAD" | grep -E "${protected}" || true)"
          {
            echo "## Protected paths"
            if [ -z "${changed}" ]; then
              echo "No protected path changed."
            else
              echo "Changed protected files:"
              echo
              echo "${changed}" | sed 's/^/- `/; s/$/`/'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          [ -z "${changed}" ] && exit 0
          echo "Protected files changed:"
          echo "${changed}"
          if echo "${PR_LABELS}" | jq -e 'index("guards-change")' > /dev/null; then
            echo "Label guards-change is present: the clean-room reviewer must review this PR."
            exit 0
          fi
          echo "::error::This PR changes protected paths. A maintainer must apply the guards-change label, and the clean-room reviewer must review it."
          exit 1
