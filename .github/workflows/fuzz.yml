name: Fuzz (weekly)

# cargo-fuzz on every decoder that reads outside bytes [#220]: the module
# protocol frames, the Modbus RTU parser, approval messages and WorldText
# fencing. A crash fails the job and uploads the input as an artifact; nothing
# is committed and no issue is opened (the token is read-only, so the red job
# is the signal). A crash input becomes a regression test by hand.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        default: "600"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - module_protocol_frame
          - busguard_modbus_rtu
          - approvals_message
          - world_text_fence
    env:
      # cargo-fuzz needs a nightly compiler (sanitizers). Selecting it with
      # this variable in this job only leaves rust-toolchain.toml, and every
      # other job, on the pinned stable.
      RUSTUP_TOOLCHAIN: nightly
      FUZZ_SECONDS: ${{ inputs.seconds || '600' }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          key: fuzz-${{ matrix.target }}
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Restore the corpus
        id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Write the seed corpus
        working-directory: fuzz
        run: cargo run --locked --example gen_seeds
      - name: Fuzz
        working-directory: fuzz
        run: |
          set -o pipefail
          cargo fuzz run "$TARGET" -- \
            -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=2048 -timeout=10 2>&1 \
            | tee "$RUNNER_TEMP/fuzz.log"
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Fuzz: \`$TARGET\`"
            echo
            echo "| Seconds | Result | Last libFuzzer line |"
            echo "| ---: | --- | --- |"
            if ls fuzz/artifacts/"$TARGET"/* >/dev/null 2>&1; then
              result="CRASH (input uploaded as an artifact)"
            elif [ "${JOB_STATUS}" = "success" ]; then
              result="no crash"
            else
              result="job failed before finishing"
            fi
            last="$(grep -E '^(#[0-9]+|Done )' "$RUNNER_TEMP/fuzz.log" | tail -n 1 || true)"
            echo "| ${FUZZ_SECONDS} | ${result} | \`${last}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          JOB_STATUS: ${{ job.status }}
      - name: Save the corpus
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload the crashing input
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 30
